name: Collect GitHub Metrics

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  workflow_dispatch:       # allow manual runs from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to push data and assets back to the repo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clone stack repos for the release timeline
        # release_timeline.py reads tags and first-commit dates from local
        # clones under ~/git (GIT_ROOT). Blobless clones keep full history and
        # tags -- the only things the script reads -- without the file blobs.
        # ucla-roms is a CWorthy fork of CESR-lab; the CESR-lab remote lets the
        # script exclude upstream history so the lane starts at the fork point.
        run: |
          mkdir -p ~/git
          for repo in roms-tools C-Star ucla-roms cstar-forge; do
            git clone --filter=blob:none \
              "https://github.com/CWorthy-ocean/$repo.git" ~/git/"$repo"
          done
          git -C ~/git/ucla-roms remote add CESR-lab \
            https://github.com/CESR-lab/ucla-roms.git
          git -C ~/git/ucla-roms fetch CESR-lab --no-tags --quiet

      - name: Build release timeline plot
        run: python release_timeline.py -o assets/release-timeline.png

      - name: Collect metrics
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python collect.py

      - name: Generate plots and README
        run: python make_plots.py

      - name: Commit updated data and plots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ assets/ README.md
          git diff --staged --quiet || git commit -m "metrics: $(date -u +%Y-%m-%d)"
          git push
